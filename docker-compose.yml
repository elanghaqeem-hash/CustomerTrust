services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainlive
      POSTGRES_USER: trainlive_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trainlive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlive_owner -d trainlive"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  trainlive_pg:

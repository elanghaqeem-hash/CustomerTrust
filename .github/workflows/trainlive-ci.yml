name: TrainLive integration
on:
  push:
    paths:
      - "db/**"
      - "seed/**"
      - "tools/trainlive/**"
      - "apps/trainlive/**"
      - "deploy/hostinger/**"
      - "docs/VERCEL-NEON-AUTH0-ACTIVATION.md"
      - ".dockerignore"
      - ".github/workflows/trainlive-ci.yml"
  pull_request:
    paths:
      - "db/**"
      - "seed/**"
      - "tools/trainlive/**"
      - "apps/trainlive/**"
      - "deploy/hostinger/**"
      - "docs/VERCEL-NEON-AUTH0-ACTIVATION.md"
      - ".dockerignore"
      - ".github/workflows/trainlive-ci.yml"

permissions:
  contents: read

jobs:
  isolation-and-build:
    # Pin OS supported by the Playwright Chromium browser bundle.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trainlive
          POSTGRES_USER: trainlive_owner
          POSTGRES_PASSWORD: trainlive_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainlive_owner -d trainlive"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL_ADMIN: postgresql://trainlive_owner:trainlive_ci_only@localhost:5432/trainlive
      DATABASE_URL_APP: postgresql://trainlive_web:trainlive_ci_web_only@localhost:5432/trainlive
      TRAINLIVE_JWT_SECRET: trainlive_ci_test_key_not_used_in_production_2026
      # Non-routable CI-only OIDC fixture. It is never a production identity provider.
      TRAINLIVE_APP_ORIGIN: https://trainlive.example.invalid
      TRAINLIVE_OIDC_ISSUER: https://login.example.invalid
      TRAINLIVE_OIDC_CLIENT_ID: trainlive-ci-fixture
      TRAINLIVE_OIDC_ALLOWED_EMAIL_DOMAINS: example.invalid
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check seed fidelity and shape
        run: node tools/trainlive/validate-seed.mjs
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/001_core.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/002_rls.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/003_runtime.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/004_worksheets.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/005_observer_audit.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/006_join_throttle.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/007_staff_oidc.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/008_production_preflight.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/009_join_throttle_multiclass.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/010_admin_class_create.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/011_class_lifecycle.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/012_class_close_guard.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/013_super_admin_sso_entry.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/014_latest_content_and_capacity.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/015_class_branding.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/016_lms_catalog.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -v app_password=trainlive_ci_web_only -f deploy/hostinger/create-runtime-role.sql
      - name: Real-PostgreSQL RLS isolation tests
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/01_rls_isolation.sql
      - name: Auto-LK2 and worksheet points isolation
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/02_worksheet.sql
      - name: Distributed join throttle test
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/03_join_throttle.sql
      - name: Shared office IP and per-class join limiter
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/06_join_throttle_multiclass.sql
      - name: Install database tooling
        run: npm install --prefix tools/trainlive --no-audit --no-fund
      - name: Seed v1 and v2 twice (idempotency and immutability)
        run: |
          node tools/trainlive/seed.mjs
          node tools/trainlive/seed.mjs
      - name: db-setup runner baseline, status and runtime preflight
        run: |
          last="$(basename "$(ls db/migrations/0*.sql | tail -n 1)" | cut -c1-3)"
          node tools/trainlive/db-setup.mjs migrate --baseline-through="$last"
          node tools/trainlive/db-setup.mjs status
          node tools/trainlive/db-setup.mjs verify
          # The migration owner must never pass the runtime preflight.
          if DATABASE_URL_APP="$DATABASE_URL_ADMIN" node tools/trainlive/db-setup.mjs verify; then
            echo "owner login unexpectedly accepted as runtime"; exit 1; fi
      - name: Prove that the backup restores to a disposable isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dump="$(mktemp --suffix=.dump)"
          trap 'rm -f "$dump"' EXIT
          # Use pg_dump 16 to match the PostgreSQL 16 recovery image; the
          # runner may ship pg_dump 17/18, whose custom archive is unsupported
          # by pg_restore 16 (archive header 1.16).
          docker run --rm --network host -e DATABASE_URL_ADMIN postgres:16-alpine \
            sh -c 'pg_dump "$DATABASE_URL_ADMIN" --format=custom' > "$dump"
          bash deploy/hostinger/restore-drill.sh "$dump"
      - name: Create two independent classes with the same master
        run: |
          d="$(TZ=Asia/Makassar date +%F)"
          node tools/trainlive/create-class.mjs "$d" A > /tmp/trainlive-class-a.json
          node tools/trainlive/create-class.mjs "$d" B > /tmp/trainlive-class-b.json
          test "$(jq -r '.class_id' /tmp/trainlive-class-a.json)" != "$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
      - name: Staff OIDC binding, MFA-authorized class mapping and cross-class rejection
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/04_staff_oidc.sql
      - name: Super Admin SSO route cannot grant access to unauthorized identities
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/07_super_admin_sso_entry.sql
      - name: Branding is class-specific and only Super Admin can edit
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/08_class_branding.sql
      - name: LMS tenant isolation and Super Admin catalog controls
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/09_lms_catalog.sql
      - name: Production preflight validates restricted runtime, RLS and published seed
        run: psql "$DATABASE_URL_APP" -v ON_ERROR_STOP=1 -f db/tests/05_production_preflight.sql
      - name: Typecheck and build Next.js application
        run: |
          npm install --prefix apps/trainlive --no-audit --no-fund
          npm run typecheck --prefix apps/trainlive
          node --experimental-strip-types apps/trainlive/tests/oidc-issuer.mjs
          node --experimental-strip-types apps/trainlive/tests/oidc-google.mjs
          npm run build --prefix apps/trainlive
      - name: Admin login page is served without a class ID
        run: |
          npm run start --prefix apps/trainlive -- -p 3350 > /tmp/trainlive-admin-login.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3350/admin/login > /tmp/trainlive-admin.html; then break; fi
            sleep 1
          done
          grep -q 'Login Administrator' /tmp/trainlive-admin.html
          grep -q '/api/auth/staff/start?role=admin' /tmp/trainlive-admin.html
          echo 'PASS: standalone admin entry route'
      - name: Hostinger VPS Compose contract and container builds
        run: |
          bash -n deploy/hostinger/bootstrap.sh
          bash -n deploy/hostinger/backup.sh
          bash -n deploy/hostinger/preflight.sh
          bash -n deploy/hostinger/restore-drill.sh
          bash -n deploy/hostinger/smoke.sh
          node --check tools/trainlive/assign-staff.mjs
          docker compose --env-file deploy/hostinger/hostinger.env.example \
            -f deploy/hostinger/compose.yaml config --quiet
          # Validate two-network architecture without printing secrets.
          docker compose --env-file deploy/hostinger/hostinger.env.example \
            -f deploy/hostinger/compose.yaml config --format json | jq -e '
              .networks.private_db.internal == true and
              (.services.db.networks | has("private_db")) and
              (.services.db.networks | has("edge") | not) and
              (.services.db.ports == null) and
              (.services.app.networks | has("edge") and has("private_db")) and
              (.services.proxy.networks | has("edge")) and
              (.services.proxy.networks | has("private_db") | not)
            ' >/dev/null
          docker build -f deploy/hostinger/Dockerfile -t trainlive-hostinger-app-ci .
          docker build -f deploy/hostinger/Dockerfile.tools -t trainlive-hostinger-tools-ci .
      - name: Hostinger production denies manual staff JWT even without VERCEL_ENV
        shell: bash
        run: |
          set -euo pipefail
          # Mimic non-Vercel production without using a real identity provider or bank data.
          env -u CI -u VERCEL_ENV NODE_ENV=production \
            TRAINLIVE_APP_ORIGIN=https://trainlive.seraya.id \
            npm run start --prefix apps/trainlive -- -p 3341 > /tmp/trainlive-prod-guard.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          class_id="$(jq -r '.class_id' /tmp/trainlive-class-a.json)"
          # This is an authentication-only regression: do not require the
          # simulated deployment to have a fully operating public IdP.
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:3341/api/auth/staff/status?classId=$class_id" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:3341/api/auth/staff/status?classId=$class_id" | \
            jq -e '.configured==true and .manualAllowed==false and .authenticated==false'
          echo "Security probe: staff status endpoint available; validating bearer rejection"
          token="$(node tools/trainlive/provision-facilitator.mjs "$class_id" hostinger-guard@example.invalid | tail -n 1)"
          test -n "$token"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "http://localhost:3341/api/class/$class_id/items")"
          test "$status" = "403"
          curl -fsS "http://localhost:3341/api/auth/staff/status?classId=$class_id" | \
            jq -e '.configured==true and .manualAllowed==false and .authenticated==false'
          echo "PASS: real-domain Hostinger production rejects staff JWT bearer and requires SSO/MFA"
      - name: Block critical production dependency vulnerabilities
        run: |
          # npm install above generates a resolved lockfile for this exact CI run.
          # Scan production dependencies only; never suppress critical findings.
          npm audit --prefix apps/trainlive --omit=dev --audit-level=critical
      - name: Block critical training-tool dependency vulnerabilities
        run: npm audit --prefix tools/trainlive --omit=dev --audit-level=critical
      - name: Staff report and CSV export are class-bound
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3335 > /tmp/trainlive-staff.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3335/api/health >/dev/null; then break; fi
            sleep 1
          done
          a_id="$(jq -r '.class_id' /tmp/trainlive-class-a.json)"
          b_id="$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
          staff_token="$(node tools/trainlive/provision-facilitator.mjs "$a_id" staff@example.invalid | tail -n 1)"
          test -n "$staff_token"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/chat" | jq -e '.classId=="'"$a_id"'"'
          code_unauthorized="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:3335/api/class/$a_id/chat")"
          test "$code_unauthorized" = "403"
          node tools/trainlive/test-report-fixture.mjs "$a_id"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/report" > /tmp/trainlive-report.json
          echo "Staff report returned class: $(jq -r '.classId' /tmp/trainlive-report.json); expected: $a_id"
          test "$(jq -r '.classId' /tmp/trainlive-report.json)" = "$a_id"
          test "$(jq -r '.summary.pre_mean' /tmp/trainlive-report.json)" = "70"
          test "$(jq -r '.summary.post_mean' /tmp/trainlive-report.json)" = "90"
          test "$(jq -r '.summary.paired_mean_gain' /tmp/trainlive-report.json)" = "20"
          denied="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$b_id/report")"
          echo "Cross-class staff report HTTP status: $denied"
          test "$denied" = "403"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=csv" > /tmp/trainlive-report.csv
          grep -q "$a_id" /tmp/trainlive-report.csv
          if grep -q "$b_id" /tmp/trainlive-report.csv; then echo "Cross-class CSV leak"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=xlsx" > /tmp/trainlive-report.xlsx
          test "$(head -c 2 /tmp/trainlive-report.xlsx)" = "PK"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=pdf" > /tmp/trainlive-report.pdf
          test "$(head -c 4 /tmp/trainlive-report.pdf)" = "%PDF"
          for fmt in csv xlsx pdf; do
            denied="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $staff_token" \
              "http://localhost:3335/api/class/$b_id/export?format=$fmt")"
            test "$denied" = "403"
          done
          echo "PASS: class A CSV/XLSX/PDF exports, class B denied"
          # Only an explicitly promoted super-admin facilitator may create a class.
          d="$(TZ=Asia/Makassar date +%F)"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $staff_token" -H "Content-Type: application/json" \
            --data "{\"name\":\"Customer Trust CI\",\"batch\":\"NEW-CI\",\"date\":\"$d\"}" \
            "http://localhost:3335/api/class/$a_id/admin")"
          test "$denied" = "403"
          node tools/trainlive/promote-admin.mjs "$a_id" staff@example.invalid APPROVE-TRAINLIVE-SUPER-ADMIN
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/admin" | jq -e '.canCreate==true'
          curl -fsS -H "Authorization: Bearer $staff_token" -H "Content-Type: application/json" \
            --data "{\"name\":\"Customer Trust CI\",\"batch\":\"NEW-CI\",\"date\":\"$d\"}" \
            "http://localhost:3335/api/class/$a_id/admin" > /tmp/trainlive-created-class.json
          created_id="$(jq -r '.classId' /tmp/trainlive-created-class.json)"
          test -n "$created_id" && test "$created_id" != "$a_id"
          jq -e '.joinCode | test("^[A-HJ-NP-Z2-9]{6}$")' /tmp/trainlive-created-class.json
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT count(*) FROM trainlive.class_item WHERE class_id='$created_id'")" = "17"
          # Admin-created classes use the newest published content (v2, deck revision 13).
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT v.version_no FROM trainlive.class_session c JOIN trainlive.content_version v ON v.id=c.content_version_id WHERE c.id='$created_id'")" = "2"
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT count(*) FROM trainlive.class_item WHERE class_id='$created_id' AND item_key='TE1' AND slide_ref=15")" = "1"
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT count(*) FROM trainlive.class_worksheet WHERE class_id='$created_id'")" = "5"
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT count(*) FROM trainlive.participant WHERE class_id='$created_id'")" = "0"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$created_id/items")"
          test "$denied" = "403"
          # Newly created classes start scheduled and require an authorized host transition.
          created_token="$(node tools/trainlive/provision-facilitator.mjs "$created_id" staff@example.invalid "CI Admin" --leave-scheduled | tail -n 1)"
          test -n "$created_token"
          curl -fsS -H "Authorization: Bearer $created_token" \
            "http://localhost:3335/api/class/$created_id/lifecycle" | jq -e '.status=="scheduled"'
          curl -fsS -H "Authorization: Bearer $created_token" -H "Content-Type: application/json" \
            --data '{"action":"start"}' \
            "http://localhost:3335/api/class/$created_id/lifecycle" | jq -e '.status=="live"'
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $created_token" -H "Content-Type: application/json" \
            --data '{"action":"start"}' \
            "http://localhost:3335/api/class/$created_id/lifecycle")"
          test "$denied" = "422"
          # Open an item with an unlimited timer; class closure must still
          # stop further responses and close the item atomically.
          item_id="$(curl -fsS -H "Authorization: Bearer $created_token" \
            "http://localhost:3335/api/class/$created_id/items" | jq -r '.items[0].id')"
          curl -fsS -H "Authorization: Bearer $created_token" -H "Content-Type: application/json" \
            --data "{\"itemId\":\"$item_id\",\"action\":\"open\"}" \
            "http://localhost:3335/api/class/$created_id/action" | jq -e '.action=="open"'
          new_code="$(jq -r '.joinCode' /tmp/trainlive-created-class.json)"
          curl -fsS -c /tmp/trainlive-created-participant-cookie \
            -H 'Content-Type: application/json' \
            --data "{\"code\":\"$new_code\",\"displayName\":\"Test Participant\",\"unit\":\"SYNTHETIC\",\"email\":\"\",\"consent\":true}" \
            http://localhost:3335/api/join | jq -e '.classId=="'"$created_id"'"'
          curl -fsS -H "Authorization: Bearer $created_token" -H "Content-Type: application/json" \
            --data '{"action":"close"}' \
            "http://localhost:3335/api/class/$created_id/lifecycle" | jq -e '.status=="closed" and .automaticallyClosedItems==1'
          test "$(psql "$DATABASE_URL_ADMIN" -At -c "SELECT count(*) FROM trainlive.class_item WHERE class_id='$created_id' AND state='open'")" = "0"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -b /tmp/trainlive-created-participant-cookie -H 'Content-Type: application/json' \
            --data "{\"itemId\":\"$item_id\",\"answer\":\"A\"}" \
            "http://localhost:3335/api/class/$created_id/respond")"
          test "$denied" = "409"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $created_token" -H "Content-Type: application/json" \
            --data '{"action":"start"}' \
            "http://localhost:3335/api/class/$created_id/lifecycle")"
          test "$denied" = "422"
          echo "PASS: scheduled -> live -> closed, no re-opening or late response"
          # Observer cannot act as administrator even when previously promoted.
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c \
            "UPDATE trainlive.class_staff SET role='observer' WHERE class_id='$a_id' AND user_id=(SELECT id FROM trainlive.staff_user WHERE email='staff@example.invalid')"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/admin" | jq -e '.canCreate==false'
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $staff_token" -H "Content-Type: application/json" \
            --data "{\"name\":\"Denied Observer\",\"batch\":\"DENY-2\",\"date\":\"$d\"}" \
            "http://localhost:3335/api/class/$a_id/admin")"
          test "$denied" = "403"
          echo "PASS: admin provisioning, class snapshot, zero personal records, observer denied"
          # Observer can view class data but may not perform facilitator actions.
          role_before="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/capabilities" | jq -r '.role')"
          test "$role_before" = "observer"
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c \
            "UPDATE trainlive.class_staff SET role='observer' WHERE class_id='$a_id' AND user_id=(SELECT id FROM trainlive.staff_user WHERE email='staff@example.invalid')"
          capabilities="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/capabilities")"
          echo "$capabilities" | jq -e '.role=="observer" and .canManage==false and .canReport==true'
          item_id="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/items" | jq -r '.items[0].id')"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $staff_token" -H 'Content-Type: application/json' \
            --data "{\"itemId\":\"$item_id\",\"action\":\"open\"}" \
            "http://localhost:3335/api/class/$a_id/action")"
          test "$denied" = "403"
          echo "PASS: observer permissions are read-only"
      - name: REST cross-class token smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3333 > /tmp/trainlive-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3333/api/health >/dev/null; then break; fi
            sleep 1
          done
          a_code="$(jq -r '.join_code' /tmp/trainlive-class-a.json)"
          b_id="$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
          a_id="$(jq -r '.class_id' /tmp/trainlive-class-a.json)"
          cross_site="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://attacker.invalid' -H 'Sec-Fetch-Site: cross-site' \
            -H 'content-type: application/json' -d '{}' \
            http://localhost:3333/api/join)"
          test "$cross_site" = "403"
          curl -fsS -c /tmp/trainlive-cookies.txt -H 'Origin: http://localhost:3333' -H 'Sec-Fetch-Site: same-origin' -H 'content-type: application/json' \
            --data "{\"code\":\"$a_code\",\"displayName\":\"Fixture A\",\"unit\":\"HQ\",\"email\":\"\",\"consent\":true}" \
            http://localhost:3333/api/join > /tmp/trainlive-join.json
          test "$(jq -r '.classId' /tmp/trainlive-join.json)" = "$a_id"
          code="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/trainlive-cookies.txt \
            http://localhost:3333/api/class/"$b_id"/items)"
          test "$code" = "403"
          code_ok="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/trainlive-cookies.txt \
            http://localhost:3333/api/class/"$a_id"/items)"
          test "$code_ok" = "200"
          echo "PASS: REST token A gets 403 for class B, 200 for class A"

      - name: Concurrent 25-seat class acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3337 > /tmp/trainlive-capacity.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3337/api/health >/dev/null; then break; fi
            sleep 1
          done
          d="$(TZ=Asia/Makassar date +%F)"
          node tools/trainlive/create-class.mjs "$d" CAPACITY > /tmp/trainlive-capacity-class.json
          code="$(jq -r '.join_code' /tmp/trainlive-capacity-class.json)"
          node tools/trainlive/test-capacity.mjs http://localhost:3337 "$code"

      - name: 600 concurrent synthetic joins across 24 isolated classes on one office IP
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3338 > /tmp/trainlive-600.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3338/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3338/api/health | jq -e '.ready==true'
          d="$(TZ=Asia/Makassar date +%F)"
          for n in $(seq -w 1 24); do
            # This scenario models 24 x 25-seat classes and checks seat 26 is refused.
            TRAINLIVE_CLASS_CAPACITY=25 node tools/trainlive/create-class.mjs "$d" "PERF-${n}" > "/tmp/trainlive-perf-${n}.json"
          done
          jq -s '[.[].join_code]' /tmp/trainlive-perf-*.json > /tmp/trainlive-perf-codes.json
          node tools/trainlive/test-capacity-600.mjs \
            http://localhost:3338 /tmp/trainlive-perf-codes.json

      - name: 25 real-browser synthetic participants and facilitator acceptance
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./tools/trainlive/node_modules/.bin/playwright install --with-deps chromium
          npm run start --prefix apps/trainlive -- -p 3340 > /tmp/trainlive-browser-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f /tmp/trainlive-browser-staff-token' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3340/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3340/api/health | jq -e '.ready==true'
          curl -fsSI http://127.0.0.1:3340/ | grep -qi '^Content-Security-Policy:'
          d="$(TZ=Asia/Makassar date +%F)"
          node tools/trainlive/create-class.mjs "$d" BROWSER-UAT > /tmp/trainlive-browser-class.json
          class_id="$(jq -r '.class_id' /tmp/trainlive-browser-class.json)"
          join_code="$(jq -r '.join_code' /tmp/trainlive-browser-class.json)"
          other_id="$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
          # Extend only the synthetic class timer so browser startup is not
          # mistaken for participant latency. Regular training defaults remain unchanged.
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c \
            "UPDATE trainlive.class_item SET timer_sec=180 WHERE class_id='$class_id' AND item_key='SC1'"
          node tools/trainlive/provision-facilitator.mjs "$class_id" browser-uat@example.invalid \
            > /tmp/trainlive-browser-staff-output
          tail -n 1 /tmp/trainlive-browser-staff-output > /tmp/trainlive-browser-staff-token
          chmod 600 /tmp/trainlive-browser-staff-token
          rm -f /tmp/trainlive-browser-staff-output
          node tools/trainlive/test-browser-uat.mjs http://localhost:3340 \
            "$class_id" "$join_code" /tmp/trainlive-browser-staff-token "$other_id"

      - name: 3 parallel classes x 30+ participants — full session API simulation and browser UAT
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3342 > /tmp/trainlive-multiclass.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f /tmp/trainlive-multiclass-*.json' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3342/api/health >/dev/null; then break; fi
            sleep 1
          done
          # Disposable CI DB: earlier steps already spent this runner IP's join budget.
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c "TRUNCATE trainlive.join_throttle"
          d="$(TZ=Asia/Makassar date +%F)"
          make_classes() { # $1 batch prefix, $2 optional provision flag
            out=/tmp/trainlive-multiclass-$1.json; echo '[' > "$out"
            for n in 1 2 3; do
              c="$(node tools/trainlive/create-class.mjs "$d" "$1-$n")"
              id="$(jq -r .class_id <<<"$c")"; code="$(jq -r .join_code <<<"$c")"
              # Synthetic classes only: give slow CI browsers time to answer.
              psql "$DATABASE_URL_ADMIN" -q -v ON_ERROR_STOP=1 -c \
                "UPDATE trainlive.class_item SET timer_sec=600 WHERE class_id='$id' AND timer_sec>0"
              tok="$(node tools/trainlive/provision-facilitator.mjs "$id" "fac$n-$1@example.invalid" "Fasilitator $n" ${2:-} | tail -n 1)"
              [ "$n" -gt 1 ] && echo , >> "$out"
              jq -n --arg i "$id" --arg c "$code" --arg t "$tok" '{class_id:$i,join_code:$c,staff_token:$t}' >> "$out"
            done
            echo ']' >> "$out"
          }
          make_classes SIM
          node tools/trainlive/test-multiclass-sim.mjs http://localhost:3342 /tmp/trainlive-multiclass-SIM.json 30
          make_classes UI --leave-scheduled
          node tools/trainlive/test-ui-multiclass.mjs http://localhost:3342 /tmp/trainlive-multiclass-UI.json 32 2

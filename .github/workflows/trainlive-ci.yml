name: TrainLive integration
on:
  push:
    paths:
      - "db/**"
      - "seed/**"
      - "tools/trainlive/**"
      - "apps/trainlive/**"
      - ".github/workflows/trainlive-ci.yml"
  pull_request:
    paths:
      - "db/**"
      - "seed/**"
      - "tools/trainlive/**"
      - "apps/trainlive/**"
      - ".github/workflows/trainlive-ci.yml"

permissions:
  contents: read

jobs:
  isolation-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trainlive
          POSTGRES_USER: trainlive_owner
          POSTGRES_PASSWORD: trainlive_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainlive_owner -d trainlive"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL_ADMIN: postgresql://trainlive_owner:trainlive_ci_only@localhost:5432/trainlive
      DATABASE_URL_APP: postgresql://trainlive_web:trainlive_ci_web_only@localhost:5432/trainlive
      TRAINLIVE_JWT_SECRET: trainlive_ci_test_key_not_used_in_production_2026
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check seed fidelity and shape
        run: node tools/trainlive/validate-seed.mjs
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/001_core.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/002_rls.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/003_runtime.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/004_worksheets.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/005_observer_audit.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/006_join_throttle.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/007_staff_oidc.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/migrations/008_production_preflight.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c "CREATE ROLE trainlive_web LOGIN PASSWORD 'trainlive_ci_web_only'; GRANT trainlive_app TO trainlive_web"
      - name: Real-PostgreSQL RLS isolation tests
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/01_rls_isolation.sql
      - name: Auto-LK2 and worksheet points isolation
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/02_worksheet.sql
      - name: Distributed join throttle test
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/03_join_throttle.sql
      - name: Install database tooling
        run: npm install --prefix tools/trainlive --no-audit --no-fund
      - name: Seed v1 twice (idempotency and immutability)
        run: |
          node tools/trainlive/seed.mjs
          node tools/trainlive/seed.mjs
      - name: Create two independent classes with the same master
        run: |
          d="$(TZ=Asia/Makassar date +%F)"
          node tools/trainlive/create-class.mjs "$d" A > /tmp/trainlive-class-a.json
          node tools/trainlive/create-class.mjs "$d" B > /tmp/trainlive-class-b.json
          test "$(jq -r '.class_id' /tmp/trainlive-class-a.json)" != "$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
      - name: Staff OIDC binding, MFA-authorized class mapping and cross-class rejection
        run: psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f db/tests/04_staff_oidc.sql
      - name: Production preflight validates restricted runtime, RLS and published seed
        run: psql "$DATABASE_URL_APP" -v ON_ERROR_STOP=1 -f db/tests/05_production_preflight.sql
      - name: Typecheck and build Next.js application
        run: |
          npm install --prefix apps/trainlive --no-audit --no-fund
          npm run typecheck --prefix apps/trainlive
          npm run build --prefix apps/trainlive
      - name: Staff report and CSV export are class-bound
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3335 > /tmp/trainlive-staff.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3335/api/health >/dev/null; then break; fi
            sleep 1
          done
          a_id="$(jq -r '.class_id' /tmp/trainlive-class-a.json)"
          b_id="$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
          staff_token="$(node tools/trainlive/provision-facilitator.mjs "$a_id" staff@example.invalid | tail -n 1)"
          test -n "$staff_token"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/chat" | jq -e '.classId=="'"$a_id"'"'
          code_unauthorized="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:3335/api/class/$a_id/chat")"
          test "$code_unauthorized" = "403"
          node tools/trainlive/test-report-fixture.mjs "$a_id"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/report" > /tmp/trainlive-report.json
          echo "Staff report returned class: $(jq -r '.classId' /tmp/trainlive-report.json); expected: $a_id"
          test "$(jq -r '.classId' /tmp/trainlive-report.json)" = "$a_id"
          test "$(jq -r '.summary.pre_mean' /tmp/trainlive-report.json)" = "70"
          test "$(jq -r '.summary.post_mean' /tmp/trainlive-report.json)" = "90"
          test "$(jq -r '.summary.paired_mean_gain' /tmp/trainlive-report.json)" = "20"
          denied="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$b_id/report")"
          echo "Cross-class staff report HTTP status: $denied"
          test "$denied" = "403"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=csv" > /tmp/trainlive-report.csv
          grep -q "$a_id" /tmp/trainlive-report.csv
          if grep -q "$b_id" /tmp/trainlive-report.csv; then echo "Cross-class CSV leak"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=xlsx" > /tmp/trainlive-report.xlsx
          test "$(head -c 2 /tmp/trainlive-report.xlsx)" = "PK"
          curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/export?format=pdf" > /tmp/trainlive-report.pdf
          test "$(head -c 4 /tmp/trainlive-report.pdf)" = "%PDF"
          for fmt in csv xlsx pdf; do
            denied="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $staff_token" \
              "http://localhost:3335/api/class/$b_id/export?format=$fmt")"
            test "$denied" = "403"
          done
          echo "PASS: class A CSV/XLSX/PDF exports, class B denied"
          # Observer can view class data but may not perform facilitator actions.
          role_before="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/capabilities" | jq -r '.role')"
          test "$role_before" = "facilitator"
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c \
            "UPDATE trainlive.class_staff SET role='observer' WHERE class_id='$a_id' AND user_id=(SELECT id FROM trainlive.staff_user WHERE email='staff@example.invalid')"
          capabilities="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/capabilities")"
          echo "$capabilities" | jq -e '.role=="observer" and .canManage==false and .canReport==true'
          item_id="$(curl -fsS -H "Authorization: Bearer $staff_token" \
            "http://localhost:3335/api/class/$a_id/items" | jq -r '.items[0].id')"
          denied="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $staff_token" -H 'Content-Type: application/json' \
            --data "{\"itemId\":\"$item_id\",\"action\":\"open\"}" \
            "http://localhost:3335/api/class/$a_id/action")"
          test "$denied" = "403"
          echo "PASS: observer permissions are read-only"
      - name: REST cross-class token smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3333 > /tmp/trainlive-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3333/api/health >/dev/null; then break; fi
            sleep 1
          done
          a_code="$(jq -r '.join_code' /tmp/trainlive-class-a.json)"
          b_id="$(jq -r '.class_id' /tmp/trainlive-class-b.json)"
          a_id="$(jq -r '.class_id' /tmp/trainlive-class-a.json)"
          cross_site="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://attacker.invalid' -H 'Sec-Fetch-Site: cross-site' \
            -H 'content-type: application/json' -d '{}' \
            http://localhost:3333/api/join)"
          test "$cross_site" = "403"
          curl -fsS -c /tmp/trainlive-cookies.txt -H 'Origin: http://localhost:3333' -H 'Sec-Fetch-Site: same-origin' -H 'content-type: application/json' \
            --data "{\"code\":\"$a_code\",\"displayName\":\"Fixture A\",\"unit\":\"HQ\",\"email\":\"\",\"consent\":true}" \
            http://localhost:3333/api/join > /tmp/trainlive-join.json
          test "$(jq -r '.classId' /tmp/trainlive-join.json)" = "$a_id"
          code="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/trainlive-cookies.txt \
            http://localhost:3333/api/class/"$b_id"/items)"
          test "$code" = "403"
          code_ok="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/trainlive-cookies.txt \
            http://localhost:3333/api/class/"$a_id"/items)"
          test "$code_ok" = "200"
          echo "PASS: REST token A gets 403 for class B, 200 for class A"

      - name: Concurrent 25-seat class acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/trainlive -- -p 3337 > /tmp/trainlive-capacity.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3337/api/health >/dev/null; then break; fi
            sleep 1
          done
          d="$(TZ=Asia/Makassar date +%F)"
          node tools/trainlive/create-class.mjs "$d" CAPACITY > /tmp/trainlive-capacity-class.json
          code="$(jq -r '.join_code' /tmp/trainlive-capacity-class.json)"
          node tools/trainlive/test-capacity.mjs http://localhost:3337 "$code"
